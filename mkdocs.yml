site_name: DSA 1 Lab 2025
site_url: https://maria-djadi01.github.io/dsa-lab-2025/
site_description: Data Structures and Algorithms Lab - Interactive Learning Materials

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    # Dark mode as default
    - scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode option
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github
  favicon: images/favicon.ico

plugins:
  - search
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Maria-Djadi01/
      name: GitHub Repository
    - icon: material/email
      link: mailto:maria.djadi@etu.usthb.dz
      name: Contact Instructor
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  consent:
    title: Cookie consent
    description: We use cookies to enhance your experience.

# Repository information (if using GitHub)
repo_name: Maria-Djadi01/dsa-lab-2025
repo_url: https://github.com/Maria-Djadi01/dsa-lab-2025
edit_uri: edit/main/docs/

# Copyright footer
copyright: |
  &copy; 2025 DSA 1 Lab - Department of Computer Science

# Enhanced navigation with icons
nav:
  - Home: index.md
  - Getting Started:
      - Setup Guide: setup.md
      - GitHub Guide: github-guide.md
  - Labs:
      - Lab 1 - Basic Concepts:
          - Lab Content: lab1/lab1.md
          - Exercises: lab1/exercises.md
      - Lab 2 - Decision Making:
          - Lab Content: lab2/lab2.md
          - Exercises: lab2/exercises.md
      # - Lab 3 - Loops:
      #     - Lab Content: lab3/lab3.md
      #     - Exercises: lab3/exercises.md
# Markdown extensions for better content
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

# Extra CSS for modern styling
extra_css:
  - stylesheets/extra.css